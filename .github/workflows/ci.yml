name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts skips node-pty's native build, which tests and bundling don't need
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm test
      - run: npm run build
